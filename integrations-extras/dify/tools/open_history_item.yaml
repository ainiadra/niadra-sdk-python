identity:
  name: open_history_item
  author: niadra
  label:
    en_US: Open history item
description:
  human:
    en_US: Opens one conversation or business object from the customer's history.
  llm: 'Open one conversation or business object returned by search_customer_history or get_customer_timeline:
    what was asked, what was promised and by whom, the outcome and what memory came from it. Use it only
    after a search or timeline pointed to the item.'
parameters:
- name: customer_id_type
  type: select
  required: true
  default: phone
  options:
  - value: phone
    label:
      en_US: Phone (E.164)
  - value: whatsapp
    label:
      en_US: WhatsApp id
  - value: email
    label:
      en_US: E-mail
  - value: app_user
    label:
      en_US: App user id
  - value: system_id
    label:
      en_US: System id (system:id)
  label:
    en_US: Customer id type
  human_description:
    en_US: How the customer is identified.
  form: form
- name: customer_id
  type: string
  required: false
  label:
    en_US: Customer id
  human_description:
    en_US: The customer's phone, WhatsApp id, e-mail or id; usually a variable of the app. Never chosen
      by the model.
  form: form
- name: conversation_id
  type: string
  required: false
  label:
    en_US: Conversation id
  human_description:
    en_US: The conversation this turn belongs to, such as sys.conversation_id.
  form: form
- name: channel
  type: string
  required: false
  default: chat
  label:
    en_US: Channel
  human_description:
    en_US: 'The channel of the conversation: chat, whatsapp, voice, email...'
  form: form
- name: id
  type: string
  required: true
  label:
    en_US: Item id
  human_description:
    en_US: The item id, e.g. `episode:...`.
  form: llm
  llm_description: The item id, e.g. `episode:...`.
extra:
  python:
    source: tools/open_history_item.py
