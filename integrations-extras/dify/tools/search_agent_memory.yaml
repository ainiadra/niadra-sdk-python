identity:
  name: search_agent_memory
  author: niadra
  label:
    en_US: Search agent memory
description:
  human:
    en_US: 'Searches the agent''s own working notes: procedures, tools and pitfalls. Nothing about customers.'
  llm: 'Search your own working notes: procedures, how the company''s tools and processes behave, and
    known pitfalls. Use it before a task or a tool call you are unsure how to do. It holds nothing about
    customers; for the customer''s history use search_customer_history.'
parameters:
- name: customer_id_type
  type: select
  required: true
  default: phone
  options:
  - value: phone
    label:
      en_US: Phone (E.164)
  - value: whatsapp
    label:
      en_US: WhatsApp id
  - value: email
    label:
      en_US: E-mail
  - value: app_user
    label:
      en_US: App user id
  - value: system_id
    label:
      en_US: System id (system:id)
  label:
    en_US: Customer id type
  human_description:
    en_US: How the customer is identified.
  form: form
- name: customer_id
  type: string
  required: false
  label:
    en_US: Customer id
  human_description:
    en_US: The customer's phone, WhatsApp id, e-mail or id; usually a variable of the app. Never chosen
      by the model.
  form: form
- name: conversation_id
  type: string
  required: false
  label:
    en_US: Conversation id
  human_description:
    en_US: The conversation this turn belongs to, such as sys.conversation_id.
  form: form
- name: channel
  type: string
  required: false
  default: chat
  label:
    en_US: Channel
  human_description:
    en_US: 'The channel of the conversation: chat, whatsapp, voice, email...'
  form: form
- name: query
  type: string
  required: true
  label:
    en_US: Query
  human_description:
    en_US: What you need to know how to do.
  form: llm
  llm_description: What you need to know how to do.
extra:
  python:
    source: tools/search_agent_memory.py
