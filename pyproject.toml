[project]
name = "niadra"
version = "0.1.5"
description = "Python SDK for Niadra, the shared customer memory for every AI agent in a company: context before the model call, history, tools and MCP."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Niadra" }]
keywords = [
  "niadra", "ai-agents", "agent-memory", "llm", "customer-context", "context-engineering", "mcp",
  "function-calling", "whatsapp", "voice-ai", "customer-support", "lgpd", "gdpr",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
livekit = ["livekit-agents>=1.8.3,<2"]
pipecat = ["pipecat-ai>=1.11.0,<2; python_version >= '3.11'"]
elevenlabs = []
vapi = []
whatsapp = []
twilio = []
openai = ["openai>=1.40,<4"]
openai-agents = ["openai-agents>=0.22.3,<1"]
langchain = ["langchain-core>=1.6,<2"]
langgraph = ["langgraph>=1.2,<2", "langchain-core>=1.6,<2"]
anthropic = ["anthropic>=1.8,<2"]
bedrock = ["boto3>=1.40,<2"]
google-genai = ["google-genai>=2.25,<3"]
litellm = ["litellm>=1.102,<2"]
google-adk = ["google-adk>=2.9,<3"]
strands = ["strands-agents>=1.57,<2"]
pydantic-ai = ["pydantic-ai-slim>=2.49,<3"]
llamaindex = ["llama-index-core>=0.14.25,<0.15"]
crewai = ["crewai>=1.15,<2; python_version < '3.14'"]
agno = ["agno>=3.0.11,<4"]
agent-framework = ["agent-framework-core>=1.19,<2"]

[project.urls]
Homepage = "https://niadra.com"
Documentation = "https://docs.niadra.com/en"
Source = "https://github.com/ainiadra/niadra-sdk-python"

[project.scripts]
niadra-mock = "niadra_mock.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niadra", "src/niadra_mock"]

[tool.hatch.build.targets.sdist]
# The benchmark harness is its own project (benchmarks/pyproject.toml), never part of the package.
exclude = ["benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
# Checked by its own CI job, with its own configuration.
extend-exclude = ["benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "RET", "ARG", "ASYNC"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ARG", "N802", "PT018"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# The frameworks behind the extras are not installed in the main job, where mypy runs: their
# types are unknown there, and an adapter subclasses them.
[[tool.mypy.overrides]]
module = [
  "livekit.*", "pipecat.*", "agents.*", "langchain_core.*", "langgraph.*", "anthropic.*", "boto3.*",
  "botocore.*", "google.genai.*", "google.adk.*", "litellm.*", "strands.*", "pydantic_ai.*",
  "llama_index.*", "crewai.*", "agno.*", "agent_framework.*", "openai.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["niadra.integrations.*", "tests.integrations.*"]
disallow_subclassing_any = false
warn_unused_ignores = false
disallow_untyped_decorators = false

[tool.uv]
# Frameworks that pin incompatible versions of a shared dependency. Each is tested in its own job.
conflicts = [
  [{ extra = "pipecat" }, { extra = "crewai" }],
  [{ extra = "livekit" }, { extra = "openai-agents" }],
  [{ extra = "crewai" }, { extra = "openai-agents" }],
  [{ extra = "litellm" }, { extra = "openai-agents" }],
]
