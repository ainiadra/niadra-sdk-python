# Checks every push and pull request on every supported Python.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: The examples and the Langflow components compile
        run: uv run python -m compileall -q examples integrations-extras

  # One job per framework extra, on the lowest and highest Python it supports: installs only that
  # framework, and fails if its tests were skipped (the framework did not import).
  integration:
    name: integration (${{ matrix.extra }}, ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Frameworks that report usage by default report nothing from a test run.
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
      AGNO_TELEMETRY: "false"
      ANONYMIZED_TELEMETRY: "false"
    strategy:
      fail-fast: false
      matrix:
        extra: [livekit, pipecat, openai-agents, langchain, langgraph, anthropic, bedrock, google-genai, litellm, google-adk, strands, pydantic-ai, llamaindex, crewai, agno, agent-framework, openai]
        python: ["3.10", "3.13"]
        exclude:
          - { extra: pipecat, python: "3.10" }
          - { extra: crewai, python: "3.10" }
        include:
          - { extra: pipecat, python: "3.11" }
          - { extra: crewai, python: "3.11" }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra ${{ matrix.extra }}
      - name: Tests of the ${{ matrix.extra }} adapter
        run: |
          file="tests/integrations/test_$(echo '${{ matrix.extra }}' | tr - _).py"
          uv run pytest -rs "$file" | tee pytest.log
          ! grep -q SKIPPED pytest.log

  # The Langflow components (integrations-extras/langflow/), with Langflow's component runtime.
  langflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --with "lfx==1.12.3" pytest -rs integrations-extras/langflow | tee pytest.log
      - run: "! grep -q SKIPPED pytest.log"

  # The benchmark harness (benchmarks/): its own project and lock, its own checks. It never runs a
  # benchmark here; the runs happen inside the cloud region (benchmarks/README.md).
  benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: benchmarks/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run bench prepare --check
      - run: uv run pytest -q
