# systems: hindsight_reflect
# Hindsight read with `reflect` (hindsight_reflect): the same image and settings as deploy/systems/hindsight,
# a server and a gateway of its own, so its model calls (the extraction and every read's reasoning) are
# counted apart, and it runs alone on the host like every system.
services:
  hindsight-reflect-gateway:
    image: ${BENCH_HARNESS_IMAGE:-niadra-bench/harness:local}
    command: [serve, llm-meter, --port, "8081"]
    environment:
      LLM_UPSTREAM: ${BENCH_LLM_UPSTREAM:-http://fake-llm:9001/v1}
      LLM_API_KEY: ${BENCH_LLM_API_KEY:-}
      EMBED_UPSTREAM: http://embed:8080/v1
    mem_limit: 128m

  hindsight-reflect:
    image: ghcr.io/vectorize-io/hindsight:0.10.1
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: gateway
      HINDSIGHT_API_LLM_BASE_URL: http://hindsight-reflect-gateway:8081/v1
      HINDSIGHT_API_LLM_MODEL: ${BENCH_EXTRACTION_MODEL:-google/gemini-2.5-flash-lite}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: gateway
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://hindsight-reflect-gateway:8081/v1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: paraphrase-multilingual-minilm-l12-v2-r1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: "384"
    mem_limit: 3g
