# systems: mem0_oss mem0_oss_rerank
# Mem0's open source release, as the README of its server asks: the REST server from github.com/mem0ai/mem0
# at tag v2.2.0 (Dockerfile here), with its own pgvector database on this host (never the cell's RDS),
# and its model gateway (`bench serve llm-meter`) in front of the model provider, which counts every
# extraction call. The embedder is the benchmark's (embed, in deploy/compose/base.yaml).
services:
  mem0-db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: ${MEM0_DB_PASSWORD:-bench-local-only}
    volumes: ["./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U bench"], interval: 2s, retries: 30}
    mem_limit: 768m

  mem0-gateway:
    image: ${BENCH_HARNESS_IMAGE:-niadra-bench/harness:local}
    command: [serve, llm-meter, --port, "8081"]
    environment:
      LLM_UPSTREAM: ${BENCH_LLM_UPSTREAM:-http://fake-llm:9001/v1}
      LLM_API_KEY: ${BENCH_LLM_API_KEY:-}
    mem_limit: 128m

  mem0:
    build: {context: .}
    image: niadra-bench/mem0:v2.2.0
    depends_on: {mem0-db: {condition: service_healthy}}
    environment:
      POSTGRES_HOST: mem0-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mem0_bench
      APP_DB_NAME: mem0_bench_app
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: ${MEM0_DB_PASSWORD:-bench-local-only}
      ADMIN_API_KEY: ${MEM0_ADMIN_API_KEY:-local-admin-key-0123456789}
      JWT_SECRET: ${MEM0_JWT_SECRET:-local-jwt-secret-not-for-production-0123456789}
      # Mem0's OpenAI client wants a key; the gateway sends the real one to the provider.
      OPENROUTER_API_KEY: gateway
      OPENAI_API_KEY: not-used
      MEM0_TELEMETRY: "false"
    mem_limit: 1g
