# The local environment: fakes in place of the paid and heavy pieces, so a run needs no key and proves the
# plumbing only (its numbers are never published). niadra-mock stands in for Niadra.
services:
  models:
    image: ${BENCH_HARNESS_IMAGE:-niadra-bench/harness:local}
    command: [serve, fake-models, --port, "8080"]
    mem_limit: 128m
  fake-llm:
    image: ${BENCH_HARNESS_IMAGE:-niadra-bench/harness:local}
    command: [serve, fake-llm, --port, "9001"]
    mem_limit: 128m
  niadra-mock:
    image: ${BENCH_HARNESS_IMAGE:-niadra-bench/harness:local}
    entrypoint: [niadra-mock, --host, 0.0.0.0, --port, "8765"]
    mem_limit: 256m
  harness:
    environment:
      NIADRA_BASE_URL: http://niadra-mock:8765
      NIADRA_API_KEY: nia_sk_test_local_mock_k1_mocksecret
