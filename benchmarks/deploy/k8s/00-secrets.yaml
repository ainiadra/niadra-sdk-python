# The OpenRouter key the cell already uses (AWS Secrets Manager `niadra/platform/openrouter`, property
# `api_key`), read through the cluster's own secret store. The Mem0 server and the harness both call
# the models with it; nothing else of the platform's secrets is read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bench-openrouter
  namespace: niadra
  labels: {app.kubernetes.io/part-of: niadra-benchmarks}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: niadra}
  target:
    name: bench-openrouter
    template:
      metadata:
        labels: {app.kubernetes.io/part-of: niadra-benchmarks}
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef: {key: niadra/platform/openrouter, property: api_key}
