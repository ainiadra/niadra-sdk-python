# Mem0's two databases on the cell's RDS instance, beside Niadra's but separate: `mem0_bench` (the
# pgvector store) and `mem0_bench_app` (the server's own users and settings), owned by their own role.
# Runs as the master user, as the chart's niadra-db-init job does, because only it can create the
# `vector` extension. `bench-mem0` (created by run-in-region.sh) holds the role's password.
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-mem0-db-init
  namespace: niadra
  labels: {app.kubernetes.io/part-of: niadra-benchmarks}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: niadra-benchmarks}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              set -e
              psql -v ON_ERROR_STOP=1 --no-psqlrc -v pw="$MEM0_DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE mem0_bench LOGIN PASSWORD %L', :'pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mem0_bench') \gexec
              ALTER ROLE mem0_bench PASSWORD :'pw';
              SELECT format('GRANT mem0_bench TO %I', current_user) \gexec
              SELECT 'CREATE DATABASE mem0_bench OWNER mem0_bench'
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'mem0_bench') \gexec
              SELECT 'CREATE DATABASE mem0_bench_app OWNER mem0_bench'
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'mem0_bench_app') \gexec
              SQL
              psql -v ON_ERROR_STOP=1 --no-psqlrc -d mem0_bench -c 'CREATE EXTENSION IF NOT EXISTS vector'
          env:
            - {name: PGDATABASE, value: postgres}
            - name: PGHOST
              valueFrom: {configMapKeyRef: {name: niadra-cell, key: NIADRA_DB_DIRECT_HOST}}
            - name: PGSSLMODE
              valueFrom: {configMapKeyRef: {name: niadra-cell, key: NIADRA_DB_DIRECT_SSLMODE}}
            - name: MEM0_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: bench-mem0, key: MEM0_DB_PASSWORD}}
          envFrom: [{secretRef: {name: niadra-db-init}}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
