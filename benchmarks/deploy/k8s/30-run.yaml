# One benchmark run, inside the region, from a pod on the cell's own node: the same place the cell's
# agents-facing traffic is measured from by niadra-infra's scripts/latency.sh. Results land on the node
# in /var/lib/niadra-bench/results. HARNESS_IMAGE, BENCH_ARGS and NIADRA_SERVER_VERSION are replaced by
# run-in-region.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-run
  namespace: niadra
  labels: {app.kubernetes.io/part-of: niadra-benchmarks}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: niadra-benchmarks, app.kubernetes.io/name: bench-run}
    spec:
      restartPolicy: Never
      containers:
        - name: harness
          image: HARNESS_IMAGE
          imagePullPolicy: Never
          args: BENCH_ARGS
          env:
            - {name: BENCH_ENVIRONMENT, value: region}
            - {name: BENCH_NIADRA_SERVER_VERSION, value: "NIADRA_SERVER_VERSION"}
            - {name: NIADRA_BOOTSTRAP, value: /bootstrap/bootstrap.json}
            - {name: NIADRA_CLUSTER_URL, value: "http://read.niadra.svc:8000"}
            - {name: NIADRA_CLUSTER_INGEST_URL, value: "http://ingest.niadra.svc:8000"}
            - {name: MEM0_URL, value: "http://bench-mem0:8000"}
            - {name: MEM0_SERVER_VERSION, value: v2.2.0}
            - {name: MEM0_METER_URL, value: "http://bench-meter:8081"}
            - {name: MEM0_LLM_BASE_URL, value: "http://bench-meter:8081/v1"}
            - {name: MEM0_EMBEDDER_BASE_URL, value: "http://bench-embed:8080/v1"}
            - name: MEM0_SERVER_KEY
              valueFrom: {secretKeyRef: {name: bench-mem0, key: ADMIN_API_KEY}}
            - name: OPENROUTER_API_KEY
              valueFrom: {secretKeyRef: {name: bench-openrouter, key: OPENROUTER_API_KEY}}
            # The rerank target reads Mem0's store in-process, and its reranker calls go through the meter.
            - name: POSTGRES_HOST
              valueFrom: {configMapKeyRef: {name: niadra-cell, key: NIADRA_DB_DIRECT_HOST}}
            - {name: POSTGRES_PORT, value: "5432"}
            - {name: POSTGRES_DB, value: mem0_bench}
            - {name: POSTGRES_USER, value: mem0_bench}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: bench-mem0, key: MEM0_DB_PASSWORD}}
            - {name: OPENAI_API_KEY, value: not-used}
          volumeMounts:
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: results, mountPath: /app/results}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1536Mi}
      volumes:
        - {name: bootstrap, secret: {secretName: niadra-sandbox-bootstrap}}
        - {name: results, hostPath: {path: /var/lib/niadra-bench/results, type: DirectoryOrCreate}}
