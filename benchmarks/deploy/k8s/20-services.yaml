# What the harness measures against, beside the cell, in the same namespace (the namespace's network
# policy lets its own pods talk): Mem0's REST server, the OpenAI-compatible proxy to the cell's own
# embedding server, and the meter in front of OpenRouter that counts Mem0's model calls.
# HARNESS_IMAGE and MEM0_IMAGE are replaced by run-in-region.sh; both images are imported into the
# node's containerd, never pushed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-embed
  namespace: niadra
  labels: {app.kubernetes.io/part-of: niadra-benchmarks, app.kubernetes.io/name: bench-embed}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: bench-embed}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: niadra-benchmarks, app.kubernetes.io/name: bench-embed}
    spec:
      containers:
        - name: embed
          image: HARNESS_IMAGE
          imagePullPolicy: Never
          args: [serve, embed-proxy, --port, "8080"]
          env: [{name: NIADRA_MODELS_URL, value: "http://models:8080"}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: bench-embed
  namespace: niadra
  labels: {app.kubernetes.io/part-of: niadra-benchmarks}
spec:
  selector: {app.kubernetes.io/name: bench-embed}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-meter
  namespace: niadra
  labels: {app.kubernetes.io/part-of: niadra-benchmarks, app.kubernetes.io/name: bench-meter}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: bench-meter}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: niadra-benchmarks, app.kubernetes.io/name: bench-meter}
    spec:
      containers:
        - name: meter
          image: HARNESS_IMAGE
          imagePullPolicy: Never
          args: [serve, llm-meter, --port, "8081"]
          env: [{name: LLM_UPSTREAM, value: "https://openrouter.ai/api/v1"}]
          ports: [{containerPort: 8081}]
          readinessProbe: {httpGet: {path: /healthz, port: 8081}, periodSeconds: 5}
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: bench-meter
  namespace: niadra
  labels: {app.kubernetes.io/part-of: niadra-benchmarks}
spec:
  selector: {app.kubernetes.io/name: bench-meter}
  ports: [{port: 8081, targetPort: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-mem0
  namespace: niadra
  labels: {app.kubernetes.io/part-of: niadra-benchmarks, app.kubernetes.io/name: bench-mem0}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: bench-mem0}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: niadra-benchmarks, app.kubernetes.io/name: bench-mem0}
    spec:
      containers:
        - name: mem0
          image: MEM0_IMAGE
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          env:
            - name: POSTGRES_HOST
              valueFrom: {configMapKeyRef: {name: niadra-cell, key: NIADRA_DB_DIRECT_HOST}}
            - {name: POSTGRES_PORT, value: "5432"}
            - {name: POSTGRES_DB, value: mem0_bench}
            - {name: APP_DB_NAME, value: mem0_bench_app}
            - {name: POSTGRES_USER, value: mem0_bench}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: bench-mem0, key: MEM0_DB_PASSWORD}}
            - name: ADMIN_API_KEY
              valueFrom: {secretKeyRef: {name: bench-mem0, key: ADMIN_API_KEY}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: bench-mem0, key: JWT_SECRET}}
            - name: OPENROUTER_API_KEY
              valueFrom: {secretKeyRef: {name: bench-openrouter, key: OPENROUTER_API_KEY}}
            # The embedder's key is required by the OpenAI client and never checked by the proxy.
            - {name: OPENAI_API_KEY, value: not-used}
            - {name: MEM0_TELEMETRY, value: "false"}
          readinessProbe: {httpGet: {path: /docs, port: 8000}, periodSeconds: 5, failureThreshold: 60}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1536Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: bench-mem0
  namespace: niadra
  labels: {app.kubernetes.io/part-of: niadra-benchmarks}
spec:
  selector: {app.kubernetes.io/name: bench-mem0}
  ports: [{port: 8000, targetPort: 8000}]
