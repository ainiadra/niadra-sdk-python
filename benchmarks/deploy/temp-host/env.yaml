# The temporary host's environment (deploy/temp-host/host.sh sets the variables): the embedder is the
# niadra-models image the cell runs, from the account's registry, with the same model files; the model
# provider is OpenRouter, through each system's gateway; Niadra is the cell itself, read through its public
# address and through its private address in the VPC.
services:
  models:
    image: ${BENCH_MODELS_IMAGE:?BENCH_MODELS_IMAGE is the niadra-models image the cell runs}
    environment:
      NIADRA_MODELS_ONNX_EMBED_DIR: /models/paraphrase-multilingual-minilm-l12-v2-r1
      NIADRA_MODELS_ONNX_THREADS: "2"
    mem_limit: 1536m
  harness:
    environment:
      BENCH_ENVIRONMENT: region
      NIADRA_BOOTSTRAP: /secrets/bootstrap.json
      NIADRA_CONTROL_URL: ${NIADRA_CONTROL_URL:-https://control.api.niadra.com}
    mem_limit: 1536m
