# The frozen configuration of the benchmark. Every result file carries the SHA-256 of this file and of
# config/mem0.config.json; changing either one makes a new run, and earlier runs stay published.

[environment]
# What a published run must say about where it ran. `bench run` records what it finds, and the site
# only imports results whose environment kind is "region". `machine_class` and `database_class` are
# Niadra's cell; `harness_host` is where the harness and every other system run.
region = "us-east-2"
machine_class = "m7i-flex.large"
database_class = "db.t4g.micro"
harness_host = "temporary EC2 instance in the cell's VPC, one system at a time (deploy/temp-host)"

[production]
# What a run may send to Niadra's production cell. On 25/09/2026 the second run, on the production node
# and its db.t4g.micro, saturated PgBouncer (4 server connections per database and role, 6 per database)
# and the database went into recovery with 52 MB free (niadra-docs estudo/09-RODADAS.md). The afternoon
# run had seeded about 12 batches a second with about 18% of the conversations extracted (174 of 986),
# so about 2 extractions a second reached the workers, and the cell held. Since niadra-back bb4ecaa
# nearly every conversation is extracted: the same 12 a second became about 10 extractions a second.
#
# Seeding: at most 2 batches a second across every seeding task (dataset v2: 2,780 batches, 2,328 of
# them conversations, so about 1.7 extractions a second, the rate the cell absorbed on 25/09), 4 at a
# time; a 429 or 503 pauses every seeding task for `pause_on_overload_s` (or the Retry-After, if longer).
# About 23 minutes per repetition of dataset v2.
seed_batches_per_s = 2.0
seed_concurrency = 4
# Reads outside the timed loops (settle, the accuracy pass, verifications): 4 at a time, and the settle
# pass reads every case at most once per `settle_interval_s`.
read_concurrency = 4
settle_interval_s = 10
# Timed loops against Niadra. `context()` serves the cached pack, so it is read at both rates (10 and
# 25 a second) through the public address and the VPC. History navigation opens a transaction on the
# space's database per call (and writes a receipt), and each ingestion call writes two events in one
# transaction and opens a conversation to extract every 10 calls: both only at 10 a second, where one
# 30 s line is 300 calls and 30 new conversations per path. The other systems run on the benchmark's own
# host and keep the rates of [latency], [history] and [ingest].
latency_rates = [10, 25]
history_rates = [10]
ingest_rates = [10]
pause_on_overload_s = 30

[run]
# Every repetition seeds fresh customers (new handles and user ids), so extraction runs again.
repetitions = 3
# How many cases are seeded and asked at the same time, per system.
concurrency = 8
# After seeding Niadra, wait until the context of every case stops changing for `settle_quiet_s`
# (the extraction runs in the background), at most `settle_timeout_s`.
settle_quiet_s = 20
settle_timeout_s = 1200

[dataset]
seed = 20260924
cases_per_language = 120
languages = ["pt", "en"]
min_sessions = 3
max_sessions = 8

# Fixed proportions per language (sum = cases_per_language).
[dataset.categories]
continuity = 20
identity = 20
recurrence = 16
order_time = 16
promise_action = 16
privacy = 16
contradiction = 16

[latency]
# Open loop: requests leave at a constant rate whatever the answers do, the way turns arrive.
rates = [10, 25]
duration_s = 30
conversations = 20
request_timeout_s = 10

[tokens]
encoding = "o200k_base"

[history]
# Metric 8, history navigation (the docs promise `search` and `open` in under 200 ms, in the region):
# measured like [latency], open loop at constant rates over seeded customers, each call timed alone.
# Niadra reads as a voice agent that proved the caller at V1 before the clock starts; `max_tokens` is
# the SDK's default for `search()`. Mem0 searches with the [mem0] settings.
rates = [10, 25]
duration_s = 30
conversations = 20
request_timeout_s = 10
max_tokens = 800

[ingest]
# Metric 9, ingestion acknowledgement (the docs promise it in under 80 ms): one exchange (the
# customer's message and the agent's answer) per call, open loop at constant rates, spread over the
# seeded customers, `turns_per_conversation` exchanges per conversation. Mem0 in both of its add()
# modes: `raw` (infer=False) and `infer` (its default, the extraction runs before the answer).
rates = [10, 25]
duration_s = 30
conversations = 20
request_timeout_s = 10
turns_per_conversation = 10
mem0_modes = ["raw", "infer"]
# After each of Mem0's infer loops: its server keeps working on requests the client gave up on, and
# the next line starts only after this pause.
cooldown_s = 60

[freshness]
trials = 20
poll_interval_ms = 50
timeout_s = 30

[resilience]
trials = 20
delay_ms = 2000
status = 503
# What a voice turn can spend waiting for memory before the agent must speak.
turn_budget_ms = 1000

[niadra]
# The views an agent reads: `chat` for text channels, `voice` for calls.
views = ["chat", "voice"]

[mem0]
# Search as the Mem0 documentation recommends for mem0ai 2.2.0 (threshold and rerank are its defaults).
top_k = 10
threshold = 0.1
# One add() per exchange (the customer's message and the agent's answer), as the Mem0 README does; the
# v3 extraction reads both roles in one LLM call. System events and agent actions go in as raw text
# (infer=False): they are records of a system, not conversation.
render_header = "Based on previous conversations, I recall:"

[agent]
# The one agent that answers the probe question for every system: same prompt, same model.
model = "openai/gpt-4.1-mini"
temperature = 0
max_tokens = 200

[judge]
model = "openai/gpt-4.1-mini"
temperature = 0
max_tokens = 150

[models]
# The model every memory system extracts with, through OpenRouter, and the embedder every system that
# takes one uses (a system whose model is fixed keeps its own, and the README says which).
extraction = "google/gemini-2.5-flash-lite"
embedder = "paraphrase-multilingual-minilm-l12-v2-r1"

# Public prices on 2026-09-24. Check them again before a run that will be published and bump the date.
[prices]
checked_on = "2026-09-24"

[prices.openrouter]
# USD per million tokens (input, output), https://openrouter.ai/models
source = "https://openrouter.ai/models"
"google/gemini-2.5-flash-lite" = [0.10, 0.40]
"openai/gpt-4.1-mini" = [0.40, 1.60]
"openai/gpt-4o-mini" = [0.15, 0.60]

[prices.niadra]
# USD per thousand conversations or tasks, https://niadra.com/preco. The models Niadra calls are included.
source = "https://niadra.com/preco"
low = 5.0
high = 15.0

[prices.mem0_platform]
# Monthly plans, https://mem0.ai/pricing: [monthly USD, add() per month, search() per month].
source = "https://mem0.ai/pricing"
hobby = [0.0, 10000, 1000]
starter = [19.0, 50000, 5000]
pro = [249.0, 500000, 50000]

[cost]
# A conversation of this many exchanges, with one context read (or search) and one add() per exchange.
turns_per_conversation = 10
