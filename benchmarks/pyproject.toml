[project]
name = "niadra-benchmarks"
version = "0.1.0"
description = "Open, reproducible benchmark of Niadra against Mem0 and other memory systems: context latency, tokens, cost, cross-channel accuracy, privacy, freshness, resilience, history navigation and ingestion."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Niadra" }]
dependencies = [
  # The published SDK, pinned: the benchmark measures what a customer installs. It also ships niadra-mock.
  "niadra==0.4.0",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "tiktoken>=0.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Mem0 as its README recommends for the new algorithm (hybrid search needs the nlp extra), plus the
# Postgres driver its pgvector store uses. Only the in-process rerank target and the Platform target
# import it; the REST target talks HTTP.
mem0 = [
  "mem0ai[nlp]==2.2.0",
  # The spaCy model Mem0's hybrid search loads; pinned here so no pod downloads it at run time.
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "psycopg[binary]>=3.2.8,<4",
  "psycopg-pool>=3.2.6,<4",
]

[project.scripts]
bench = "niadra_bench.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/niadra_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "RET", "ARG", "ASYNC"]
ignore = ["S101", "S311", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# A verbatim copy of the SDK's `niadra.backing` (src/niadra_bench/vendor/__init__.py).
"src/niadra_bench/vendor/niadra_backing.py" = ["ALL"]
"tests/**" = ["S105", "S106", "ARG", "N802", "PT018", "S603", "S607"]
# Prompts and dataset templates are content: a line is a sentence.
"src/niadra_bench/agent.py" = ["E501"]
"src/niadra_bench/dataset/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mem0", "mem0.*", "tiktoken", "tiktoken.*", "niadra_mock", "niadra_mock.*"]
ignore_missing_imports = true
